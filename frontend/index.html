<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DocQuery — Your Documents</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&amp;family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          paper: "var(--paper)",
          "paper-raised": "var(--paper-raised)",
          ink: "var(--ink)",
          accent: "var(--accent)",
          "accent-strong": "var(--accent-strong)",
          highlight: "var(--highlight)",
          verified: "var(--verified)",
          danger: "var(--danger)",
          line: "var(--line)",
        },
      },
    },
  };
</script>
<link rel="stylesheet" href="src/styles.css" />
</head>
<body class="min-h-screen bg-paper text-ink">

<header class="border-b border-line">
  <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="index.html" class="font-serif-display text-xl font-semibold">DocQuery</a>
    <nav class="flex items-center gap-3">
      <a href="chat.html" class="text-sm font-medium px-3.5 py-1.5 rounded-md bg-accent text-white hover:bg-accent-strong transition-colors">Ask your documents</a>
      <button data-theme-toggle aria-pressed="false" class="text-sm text-ink/60 dark:text-paper/60 hover:text-ink dark:hover:text-paper px-2 py-1.5">Dark mode</button>
    </nav>
  </div>
</header>

<main class="max-w-6xl mx-auto px-6 py-10">

  <section class="mb-10">
    <div class="flex items-baseline justify-between mb-4">
      <h1 class="font-serif-display text-2xl font-semibold">Your documents</h1>
      <span id="doc-count" class="text-sm text-ink/50 dark:text-paper/50"></span>
    </div>

    <div id="dropzone" tabindex="0" role="button" aria-label="Upload a document"
         class="border-2 border-dashed border-line rounded-lg p-8 text-center cursor-pointer hover:border-accent focus-visible:border-accent transition-colors">
      <p class="font-medium">Drop a file here, or click to browse</p>
      <p class="text-sm text-ink/50 dark:text-paper/50 mt-1">PDF, TXT, or DOCX &middot; up to <span id="max-size-label">10</span> MB</p>
      <input type="file" id="file-input" class="hidden" accept=".pdf,.txt,.docx" multiple />
    </div>

    <div id="upload-queue" class="mt-4 space-y-2"></div>
  </section>

  <section>
    <div id="documents-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    <div id="documents-empty" class="hidden"></div>
  </section>

  <section class="mt-16 pt-10 border-t border-line">
    <h2 class="font-serif-display text-xl font-semibold mb-1">Get in touch</h2>
    <p class="text-sm text-ink/60 dark:text-paper/60 mb-4">Questions or feedback about DocQuery itself.</p>
    <form id="contact-form" class="grid gap-3 max-w-lg">
      <input type="text" name="name" placeholder="Name" required
             class="border border-line rounded-md px-3 py-2 bg-paper-raised focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent" />
      <input type="email" name="email" placeholder="Email" required
             class="border border-line rounded-md px-3 py-2 bg-paper-raised focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent" />
      <textarea name="message" placeholder="Message" required rows="4"
                class="border border-line rounded-md px-3 py-2 bg-paper-raised focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent"></textarea>
      <button type="submit" class="justify-self-start bg-ink text-paper dark:bg-paper dark:text-ink px-4 py-2 rounded-md text-sm font-medium hover:opacity-90 transition">
        Send message
      </button>
    </form>
  </section>

</main>

<div id="confirm-modal" class="hidden fixed inset-0 bg-ink/40 items-center justify-center z-40">
  <div class="bg-paper-raised rounded-lg border border-line p-6 max-w-sm mx-4">
    <p id="confirm-message" class="font-medium mb-4"></p>
    <div class="flex justify-end gap-2">
      <button id="confirm-cancel" class="px-3 py-1.5 rounded-md text-sm border border-line">Cancel</button>
      <button id="confirm-ok" class="px-3 py-1.5 rounded-md text-sm bg-danger text-white">Delete</button>
    </div>
  </div>
</div>

<script type="module">
import { initTheme, wireThemeToggle } from "./src/theme.js";
import * as api from "./src/api.js";
import { escapeHtml, formatFileSize, formatTimestamp, statusBadgeHtml, emptyStateHtml, createToast } from "./src/components.js";

initTheme();
wireThemeToggle();

const grid = document.getElementById("documents-grid");
const emptyBox = document.getElementById("documents-empty");
const docCountLabel = document.getElementById("doc-count");
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("file-input");
const uploadQueue = document.getElementById("upload-queue");

api.getSettings().then((s) => {
  document.getElementById("max-size-label").textContent = s.max_upload_size_mb;
}).catch(() => {});

function fileTypeLabel(type) {
  return { pdf: "PDF", txt: "Text", docx: "Word" }[type] || type.toUpperCase();
}

function renderDocumentCard(doc) {
  const details = [fileTypeLabel(doc.file_type), formatFileSize(doc.file_size)];
  if (doc.page_count) details.push(`${doc.page_count} page${doc.page_count === 1 ? "" : "s"}`);
  if (doc.chunk_count) details.push(`${doc.chunk_count} chunk${doc.chunk_count === 1 ? "" : "s"}`);

  const card = document.createElement("div");
  card.className = "doc-card animate-settle-in p-4 flex flex-col gap-2";
  card.innerHTML = `
    <div class="flex items-start justify-between gap-2">
      <p class="font-medium truncate" title="${escapeHtml(doc.original_filename)}">${escapeHtml(doc.original_filename)}</p>
      ${statusBadgeHtml(doc.processing_status)}
    </div>
    <p class="text-xs font-mono-data text-ink/50 dark:text-paper/50">${details.join(" · ")}</p>
    <p class="text-xs text-ink/40 dark:text-paper/40">${formatTimestamp(doc.upload_timestamp)}</p>
    ${doc.error_message ? `<p class="text-xs text-danger">${escapeHtml(doc.error_message)}</p>` : ""}
    <div class="flex gap-2 mt-2 pt-2 border-t border-line">
      <a href="chat.html?document=${doc.document_id}" class="text-xs font-medium text-accent hover:text-accent-strong ${doc.processing_status !== "ready" ? "pointer-events-none opacity-40" : ""}">Ask</a>
      <a href="${api.downloadUrl(doc.document_id)}" class="text-xs font-medium text-ink/60 dark:text-paper/60 hover:text-ink dark:hover:text-paper">Download</a>
      <button data-delete="${doc.document_id}" class="text-xs font-medium text-danger/80 hover:text-danger ml-auto">Delete</button>
    </div>
  `;
  return card;
}

async function loadDocuments() {
  const docs = await api.listDocuments();
  grid.innerHTML = "";
  if (docs.length === 0) {
    emptyBox.innerHTML = emptyStateHtml("No documents yet", "Upload a PDF, TXT, or DOCX file above to get started.");
    emptyBox.classList.remove("hidden");
    docCountLabel.textContent = "";
  } else {
    emptyBox.classList.add("hidden");
    docCountLabel.textContent = `${docs.length} document${docs.length === 1 ? "" : "s"}`;
    docs.forEach((doc) => grid.appendChild(renderDocumentCard(doc)));
  }
}

grid.addEventListener("click", async (event) => {
  const btn = event.target.closest("[data-delete]");
  if (!btn) return;
  const documentId = btn.dataset.delete;
  const confirmed = await confirmDialog("Delete this document? This also removes its indexed content.");
  if (!confirmed) return;
  try {
    await api.deleteDocument(documentId);
    createToast("Document deleted.", "success");
    loadDocuments();
  } catch (err) {
    createToast(err.message, "error");
  }
});

function confirmDialog(message) {
  const modal = document.getElementById("confirm-modal");
  document.getElementById("confirm-message").textContent = message;
  modal.classList.remove("hidden");
  modal.classList.add("flex");
  return new Promise((resolve) => {
    const cleanup = (result) => {
      modal.classList.add("hidden");
      modal.classList.remove("flex");
      resolve(result);
    };
    document.getElementById("confirm-ok").onclick = () => cleanup(true);
    document.getElementById("confirm-cancel").onclick = () => cleanup(false);
  });
}

// --- Upload handling -----------------------------------------------------

function addQueueItem(file) {
  const row = document.createElement("div");
  row.className = "animate-settle-in border border-line rounded-md px-3 py-2 flex items-center gap-3 bg-paper-raised";
  row.innerHTML = `
    <span class="text-sm truncate flex-1">${escapeHtml(file.name)}</span>
    <span class="text-xs font-mono-data text-ink/50 dark:text-paper/50 status-label">Uploading 0%</span>
  `;
  uploadQueue.appendChild(row);
  return row;
}

async function handleFiles(fileList) {
  const files = Array.from(fileList);
  for (const file of files) {
    const row = addQueueItem(file);
    const label = row.querySelector(".status-label");
    try {
      await api.uploadDocument(file, (pct) => {
        label.textContent = pct < 100 ? `Uploading ${pct}%` : "Processing…";
      });
      row.remove();
      await loadDocuments();
      createToast(`${file.name} uploaded.`, "success");
    } catch (err) {
      label.textContent = "Failed";
      label.classList.add("text-danger");
      row.insertAdjacentHTML("beforeend", `<span class="text-xs text-danger ml-2">${escapeHtml(err.message)}</span>`);
      setTimeout(() => row.remove(), 6000);
    }
  }
}

dropzone.addEventListener("click", () => fileInput.click());
dropzone.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") fileInput.click(); });
fileInput.addEventListener("change", (e) => { handleFiles(e.target.files); fileInput.value = ""; });
["dragover", "dragenter"].forEach((evt) =>
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add("border-accent"); })
);
["dragleave", "drop"].forEach((evt) =>
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove("border-accent"); })
);
dropzone.addEventListener("drop", (e) => handleFiles(e.dataTransfer.files));

// --- Contact form --------------------------------------------------------

document.getElementById("contact-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const payload = Object.fromEntries(new FormData(form).entries());
  try {
    await api.sendContact(payload);
    createToast("Message sent — thanks!", "success");
    form.reset();
  } catch (err) {
    createToast(err.message, "error");
  }
});

loadDocuments();
</script>
</body>
</html>
